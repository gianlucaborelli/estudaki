<section class="exam-details-page">
  <header class="page-header">
    <div>
      <span class="page-eyebrow">Gestão acadêmica</span>
      <h1>Gerenciar exames</h1>
    </div>
  </header>

  <mat-tab-group class="exam-details-tabs" dynamicHeight>
    <mat-tab label="Dados do Exame">
      <div class="tab-content">
        <app-public-notice [publicNotice]="publicNotice" (selectedExam)="onExamSelected($event)" />
        @if (selectedExam) {
          <app-exam-detail-component [exam]="selectedExam" />
        }
      </div>
    </mat-tab>
    <mat-tab label="Questões">
      <div class="tab-content">
        <app-questions-manager-component [publicNotice]="publicNotice" />
      </div>
    </mat-tab>
  </mat-tab-group>
</section>
