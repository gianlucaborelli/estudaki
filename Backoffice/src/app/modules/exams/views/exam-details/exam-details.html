<h3>Gerenciar Exames</h3>

<mat-tab-group dynamicHeight>
  <mat-tab label="Dados do Exame">
    <app-public-notice [publicNotice]="publicNotice" (selectedExam)="onExamSelected($event)" />
    @if (selectedExam) {
      <app-exam-detail-component [exam]="selectedExam" />
    }
  </mat-tab>
  <mat-tab label="Questões">
    <app-questions-manager-component [publicNotice]="publicNotice" />
  </mat-tab>
</mat-tab-group>
