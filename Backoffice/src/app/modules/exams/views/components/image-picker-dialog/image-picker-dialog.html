<h2 mat-dialog-title>Adicionar imagem</h2>

<mat-dialog-content class="image-picker">
  <div class="drop-area" tabindex="0" (paste)="onPaste($event)">
    <mat-icon>content_paste</mat-icon>

    <p>Cole uma imagem aqui (Ctrl+V) ou</p>

    <button mat-stroked-button type="button" (click)="browseFiles()">
      <mat-icon>upload</mat-icon>
      Selecionar arquivo
    </button>

    <input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event)" />

    @if (isUploading()) {
      <div class="upload-status">
        <mat-progress-spinner diameter="20" mode="indeterminate" />
        Enviando imagem...
      </div>
    }

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }
  </div>

  <div class="image-grid">
    @if (isLoading()) {
      <div class="empty-images">
        <mat-progress-spinner diameter="20" mode="indeterminate" />
        Carregando imagens...
      </div>
    } @else {
      @for (image of images(); track image) {
        <button
          type="button"
          class="image-thumb"
          [class.image-thumb-selected]="selectedUrl() === image"
          (click)="select(image)"
        >
          <img [src]="image" alt="" />
        </button>
      } @empty {
        <div class="empty-images">Nenhuma imagem enviada ainda.</div>
      }
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!selectedUrl()"
    (click)="confirm()"
  >
    OK
  </button>
</mat-dialog-actions>
