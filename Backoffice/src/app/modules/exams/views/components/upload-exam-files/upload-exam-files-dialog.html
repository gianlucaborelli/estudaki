<h2 mat-dialog-title>Anexar arquivos do exame</h2>

<mat-dialog-content class="upload-exam-files">
  <div class="file-row">
    <div class="file-info">
      <span class="file-label">Caderno de provas</span>
      <span class="file-name">{{ examFile()?.name || 'Nenhum arquivo selecionado' }}</span>
    </div>

    <button mat-stroked-button type="button" (click)="browseExamFile()">
      <mat-icon>upload</mat-icon>
      Selecionar
    </button>

    <input
      #examFileInput
      type="file"
      accept=".pdf"
      hidden
      (change)="onExamFileSelected($event)"
    />
  </div>

  <div class="file-row">
    <div class="file-info">
      <span class="file-label">Gabarito</span>
      <span class="file-name">{{ answerKeyFile()?.name || 'Nenhum arquivo selecionado' }}</span>
    </div>

    <button mat-stroked-button type="button" (click)="browseAnswerKeyFile()">
      <mat-icon>upload</mat-icon>
      Selecionar
    </button>

    <input
      #answerKeyFileInput
      type="file"
      accept=".pdf"
      hidden
      (change)="onAnswerKeyFileSelected($event)"
    />
  </div>

  @if (isUploading()) {
    <div class="upload-status">
      <mat-progress-spinner diameter="20" mode="indeterminate" />
      Enviando arquivos...
    </div>
  }

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!canSave"
    (click)="save()"
  >
    Enviar
  </button>
</mat-dialog-actions>
